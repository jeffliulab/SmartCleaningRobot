# Policy deployment configuration.
# Values MUST match the training config in cleaningrobotv2_env_cfg.py

policy_node:
  ros__parameters:
    # Policy backend: "simple" (bump-and-turn) or "model" (RL TorchScript)
    policy_type: "simple"

    # Model path (only used when policy_type=model)
    model_path: "deployment/models/best_agent_scripted.pt"

    # Action scaling — must match training env_cfg
    max_linear_vel: 0.3     # m/s
    max_angular_vel: 2.0    # rad/s

    # LiDAR preprocessing — must match training obs format
    lidar_num_rays: 360         # raw rays from sensor
    lidar_downsample_factor: 10 # 360 / 10 = 36 rays in obs
    lidar_max_distance: 3.5     # meters, for normalization

    # Coverage tracker — must match training CoverageTracker params
    coverage_grid_resolution: 0.05  # meters per cell
    coverage_local_view_size: 32    # 32x32 local patch
    robot_cleaning_radius: 0.06    # meters
    scene_bounds: [-15.0, -15.0, 15.0, 15.0]  # [x_min, y_min, x_max, y_max]

    # Control loop rate
    inference_rate: 10.0    # Hz
